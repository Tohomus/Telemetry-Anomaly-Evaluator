

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: telemetry-backend

    ports:
      
      - "8000:8000"

    env_file:
      
      - ./backend/.env

    volumes:
      
      - ./backend:/app/backend

    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend

    container_name: telemetry-frontend

    ports:
      
      - "5173:5173"

    environment:
      
      VITE_API_URL: "http://16.171.24.67:8000/"

    volumes:
      
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      
      - backend
